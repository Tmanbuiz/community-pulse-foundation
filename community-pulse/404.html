<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found | The Community Pulse Foundation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="/assets/images/logo-clean.jpg" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;
      justify-content:center;padding:28px;text-align:center;color:#2d3436;
      background:linear-gradient(150deg,#0d7377 0%,#0a5c5f 60%,#1a1a2e 100%)}
    .box{background:#fff;border-radius:20px;padding:48px 36px;max-width:480px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
    img{height:64px;width:64px;border-radius:14px;object-fit:cover;margin-bottom:20px}
    h1{font-family:'Playfair Display',Georgia,serif;font-size:2.6rem;color:#0d7377;line-height:1;margin-bottom:10px}
    h2{font-size:1.15rem;color:#1a1a2e;margin-bottom:10px}
    p{color:#636e72;font-size:.95rem;margin-bottom:26px}
    a{display:inline-block;background:#0d7377;color:#fff;text-decoration:none;font-weight:600;
      padding:13px 26px;border-radius:10px;transition:background .2s}
    a:hover{background:#0a5c5f}
  </style>
</head>
<body>
  <div class="box">
    <img src="/assets/images/logo-clean.jpg" alt="" />
    <h1>404</h1>
    <h2>We couldn't find that page</h2>
    <p>The link may be out of date, or the page may have moved. Everything else is still right where you left it.</p>
    <a href="/">Back to the home page</a>
  </div>
</body>
</html>
