<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Admin — The Community Pulse Foundation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="assets/images/logo-clean.jpg" />
  <style>
    :root{
      --primary:#0d7377; --primary-dark:#0a5c5f; --accent:#e67e22;
      --text:#2d3436; --muted:#636e72; --border:#e2e8f0; --bg:#f8fafb;
      --danger:#c0392b; --radius:12px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
    .bar{background:var(--primary);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .bar h1{font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:10px}
    .bar img{height:32px;width:32px;border-radius:8px;object-fit:cover}
    .wrap{max-width:900px;margin:0 auto;padding:24px 16px 80px}
    .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px}
    h2{font-size:1.15rem;margin-bottom:14px}
    label{display:block;font-weight:600;font-size:.85rem;margin:14px 0 5px}
    .hint{font-weight:400;color:var(--muted);font-size:.8rem}
    input[type=text],input[type=email],input[type=password],input[type=number],textarea{
      width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:9px;
      font-family:inherit;font-size:.95rem;background:#fff;color:var(--text)}
    textarea{min-height:170px;resize:vertical;line-height:1.55}
    input:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary)}
    .row{display:flex;gap:14px;flex-wrap:wrap}
    .row>div{flex:1;min-width:200px}
    .checks{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px}
    .checks label{display:flex;align-items:center;gap:8px;margin:0;cursor:pointer}
    .checks input{width:18px;height:18px;accent-color:var(--primary)}
    button{font-family:inherit;font-size:.92rem;font-weight:600;border:none;border-radius:9px;
      padding:11px 18px;cursor:pointer;transition:opacity .2s}
    button:hover{opacity:.88}
    button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--primary)}
    .btn-light{background:rgba(255,255,255,.15);color:#fff}
    .btn-danger{background:#fff;color:var(--danger);border:1px solid var(--danger)}
    .btn-sm{padding:7px 12px;font-size:.82rem}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
    .page-item{display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:14px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
    .page-item:last-child{border-bottom:none}
    .page-item strong{display:block}
    .page-item small{color:var(--muted)}
    .chip{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:99px;margin-right:6px;text-transform:uppercase;letter-spacing:.4px}
    .chip-live{background:#e6f4ea;color:#1a7f43}
    .chip-draft{background:#fdf1e3;color:#b35c00}
    .msg{padding:12px 14px;border-radius:9px;margin-bottom:16px;font-size:.9rem;display:none}
    .msg-ok{background:#e6f4ea;color:#1a7f43;display:block}
    .msg-err{background:#fdecea;color:var(--danger);display:block}
    .empty{color:var(--muted);padding:8px 0}
    .login{max-width:400px;margin:60px auto}
    .hidden{display:none}
  </style>
</head>
<body>

<div class="bar">
  <h1><img src="assets/images/logo-clean.jpg" alt="">Community Pulse — Page Admin</h1>
  <button id="signOutBtn" class="btn-light hidden" onclick="signOut()">Sign out</button>
</div>

<!-- LOGIN -->
<div class="wrap login" id="loginView">
  <div class="card">
    <h2>Admin sign in</h2>
    <div id="loginMsg" class="msg"></div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <div class="actions">
      <button class="btn-primary" onclick="signIn()">Sign in</button>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="wrap hidden" id="adminView">
  <div id="adminMsg" class="msg"></div>

  <div class="card">
    <h2 id="formTitle">Add a new page</h2>

    <label for="titleEn">Page title (English)</label>
    <input id="titleEn" type="text" placeholder="Our History" />

    <label for="titleFr">Page title (French) <span class="hint">— optional</span></label>
    <input id="titleFr" type="text" placeholder="Notre histoire" />

    <label for="slug">Web address <span class="hint">— lowercase, dashes instead of spaces</span></label>
    <input id="slug" type="text" placeholder="our-history" />

    <label for="bodyEn">Content (English)</label>
    <textarea id="bodyEn" placeholder="Write normally. Leave a blank line between paragraphs.&#10;&#10;Start a line with ## for a heading.&#10;Start a line with - for a bullet point."></textarea>

    <label for="bodyFr">Content (French) <span class="hint">— optional, English is shown if this is empty</span></label>
    <textarea id="bodyFr"></textarea>

    <div class="row">
      <div>
        <label for="menuOrder">Menu position <span class="hint">— lower numbers come first</span></label>
        <input id="menuOrder" type="number" value="1" />
      </div>
    </div>

    <div class="checks">
      <label><input id="showInMenu" type="checkbox" checked /> Show in the website menu</label>
      <label><input id="published" type="checkbox" /> Published (visible to visitors)</label>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="savePage()">Save page</button>
      <button class="btn-ghost hidden" id="cancelBtn" onclick="resetForm()">Cancel edit</button>
    </div>
  </div>

  <div class="card">
    <h2>Your pages</h2>
    <div id="pageList"><p class="empty">Loading…</p></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>
<script>
  let editingId = null;

  const $ = (id) => document.getElementById(id);

  function show(el, text, ok) {
    el.textContent = text;
    el.className = 'msg ' + (ok ? 'msg-ok' : 'msg-err');
    if (ok) setTimeout(() => { el.className = 'msg'; }, 4000);
  }

  function slugify(s) {
    return s.toLowerCase().trim()
      .replace(/[^a-z0-9\s-]/g, '')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-');
  }

  /* ---------- Auth ---------- */
  async function signIn() {
    if (!cpfDb) return show($('loginMsg'), 'Add your Supabase keys in assets/js/supabase-config.js first.', false);
    const { error } = await cpfDb.auth.signInWithPassword({
      email: $('email').value.trim(),
      password: $('password').value
    });
    if (error) return show($('loginMsg'), error.message, false);
    openDashboard();
  }

  async function signOut() {
    await cpfDb.auth.signOut();
    location.reload();
  }

  function openDashboard() {
    $('loginView').classList.add('hidden');
    $('adminView').classList.remove('hidden');
    $('signOutBtn').classList.remove('hidden');
    loadPages();
  }

  /* ---------- Read ---------- */
  async function loadPages() {
    const list = $('pageList');
    const { data, error } = await cpfDb.from('pages')
      .select('*').order('menu_order', { ascending: true });

    if (error) { list.innerHTML = `<p class="empty">${error.message}</p>`; return; }
    if (!data.length) { list.innerHTML = '<p class="empty">No pages yet. Add your first one above.</p>'; return; }

    list.innerHTML = data.map(p => `
      <div class="page-item">
        <div>
          <strong>${p.title_en}</strong>
          <small>
            <span class="chip ${p.published ? 'chip-live' : 'chip-draft'}">${p.published ? 'Live' : 'Draft'}</span>
            /page.html?slug=${p.slug}${p.show_in_menu ? '' : ' · hidden from menu'}
          </small>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn-ghost btn-sm" onclick='editPage(${JSON.stringify(p.id)})'>Edit</button>
          <button class="btn-danger btn-sm" onclick='deletePage(${JSON.stringify(p.id)}, ${JSON.stringify(p.title_en)})'>Delete</button>
        </div>
      </div>`).join('');

    window.cpfPages = data;
  }

  /* ---------- Create / update ---------- */
  async function savePage() {
    const msg = $('adminMsg');
    const titleEn = $('titleEn').value.trim();
    if (!titleEn) return show(msg, 'Add a page title in English before saving.', false);

    if (!$('slug').value.trim()) $('slug').value = slugify(titleEn);

    const row = {
      slug: slugify($('slug').value),
      title_en: titleEn,
      title_fr: $('titleFr').value.trim() || null,
      body_en: $('bodyEn').value,
      body_fr: $('bodyFr').value || null,
      show_in_menu: $('showInMenu').checked,
      menu_order: parseInt($('menuOrder').value, 10) || 0,
      published: $('published').checked
    };

    const { error } = editingId
      ? await cpfDb.from('pages').update(row).eq('id', editingId)
      : await cpfDb.from('pages').insert(row);

    if (error) {
      const dup = error.message.includes('duplicate');
      return show(msg, dup ? 'A page already uses that web address. Pick a different one.' : error.message, false);
    }

    show(msg, editingId ? 'Page updated.' : 'Page created.', true);
    resetForm();
    loadPages();
  }

  function editPage(id) {
    const p = (window.cpfPages || []).find(x => x.id === id);
    if (!p) return;
    editingId = id;
    $('formTitle').textContent = 'Edit page';
    $('titleEn').value = p.title_en || '';
    $('titleFr').value = p.title_fr || '';
    $('slug').value = p.slug || '';
    $('bodyEn').value = p.body_en || '';
    $('bodyFr').value = p.body_fr || '';
    $('menuOrder').value = p.menu_order;
    $('showInMenu').checked = p.show_in_menu;
    $('published').checked = p.published;
    $('cancelBtn').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function deletePage(id, title) {
    if (!confirm(`Delete "${title}"? This cannot be undone.`)) return;
    const { error } = await cpfDb.from('pages').delete().eq('id', id);
    if (error) return show($('adminMsg'), error.message, false);
    show($('adminMsg'), 'Page deleted.', true);
    if (editingId === id) resetForm();
    loadPages();
  }

  function resetForm() {
    editingId = null;
    $('formTitle').textContent = 'Add a new page';
    ['titleEn','titleFr','slug','bodyEn','bodyFr'].forEach(id => $(id).value = '');
    $('menuOrder').value = 1;
    $('showInMenu').checked = true;
    $('published').checked = false;
    $('cancelBtn').classList.add('hidden');
  }

  /* ---------- Start ---------- */
  $('titleEn').addEventListener('blur', () => {
    if (!$('slug').value.trim()) $('slug').value = slugify($('titleEn').value);
  });

  $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') signIn(); });

  (async () => {
    if (!cpfDb) {
      show($('loginMsg'), 'Add your Supabase keys in assets/js/supabase-config.js to start.', false);
      return;
    }
    const { data } = await cpfDb.auth.getSession();
    if (data.session) openDashboard();
  })();
</script>
</body>
</html>
