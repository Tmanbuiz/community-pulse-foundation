<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Site Manager — The Community Pulse Foundation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<link rel="icon" type="image/jpeg" href="assets/images/logo-clean.jpg" />
<style>
:root{
  --teal:#0d7377; --teal-dark:#0a5c5f; --teal-soft:#e6f2f2;
  --amber:#e67e22; --danger:#c0392b; --green:#1a7f43;
  --ink:#16232b; --text:#2d3436; --muted:#6b7a80;
  --line:#e3e9ec; --bg:#f4f7f8; --card:#fff;
  --r:14px; --shadow:0 1px 3px rgba(16,42,50,.06),0 8px 24px rgba(16,42,50,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
.hidden{display:none !important}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:50;background:var(--teal);color:#fff}
.topbar-inner{max-width:1080px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:.98rem;letter-spacing:-.01em}
.brand img{height:34px;width:34px;border-radius:9px;object-fit:cover}
.brand small{display:block;font-weight:400;font-size:.72rem;opacity:.8;letter-spacing:.02em}
.topbar button{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:8px;padding:8px 14px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.topbar button:hover{background:rgba(255,255,255,.24)}

/* ---------- tabs ---------- */
.tabs{background:var(--teal-dark);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs-inner{max-width:1080px;margin:0 auto;display:flex;gap:2px;padding:0 12px}
.tab{background:none;border:none;color:rgba(255,255,255,.72);font:inherit;font-size:.88rem;font-weight:600;
  padding:13px 16px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.tab:hover{color:#fff}
.tab.active{color:#fff;border-bottom-color:var(--amber)}

/* ---------- layout ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:26px 18px 90px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head h2{font-family:'Playfair Display',Georgia,serif;font-size:1.6rem;color:var(--ink);line-height:1.2}
.head p{color:var(--muted);font-size:.9rem;max-width:52ch}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.card-pad{padding:20px}

/* ---------- list ---------- */
.item{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.thumb{width:60px;height:60px;flex:none;border-radius:10px;object-fit:cover;background:var(--teal-soft);
  display:flex;align-items:center;justify-content:center;color:var(--teal);font-weight:700;font-size:1.15rem}
.item-main{flex:1;min-width:0}
.item-main strong{display:block;font-size:.98rem;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-main span{font-size:.82rem;color:var(--muted)}
.item-actions{display:flex;gap:8px;flex:none}
.chip{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 9px;border-radius:99px;margin-right:7px;vertical-align:1px}
.chip-live{background:#e6f4ea;color:var(--green)}
.chip-draft{background:#fdf1e3;color:#b35c00}
.empty{padding:42px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px}

/* ---------- buttons ---------- */
button{font-family:inherit;cursor:pointer;border:none;border-radius:9px;font-weight:600;transition:opacity .18s,background .18s}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn{padding:11px 18px;font-size:.9rem}
.btn-sm{padding:7px 13px;font-size:.8rem}
.btn-teal{background:var(--teal);color:#fff}
.btn-teal:hover{background:var(--teal-dark)}
.btn-out{background:#fff;color:var(--teal);border:1px solid var(--teal)}
.btn-out:hover{background:var(--teal-soft)}
.btn-red{background:#fff;color:var(--danger);border:1px solid #f0c4bf}
.btn-red:hover{background:#fdecea}
.btn-grey{background:#fff;color:var(--muted);border:1px solid var(--line)}

/* ---------- form ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-weight:600;font-size:.84rem;color:var(--ink);margin-bottom:6px}
.field .hint{font-weight:400;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=url],textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
  font:inherit;font-size:.94rem;background:#fff;color:var(--text)}
textarea{min-height:130px;resize:vertical;line-height:1.6}
input:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,115,119,.13)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:680px){.pair{grid-template-columns:1fr}}
.lang-tag{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.06em;background:var(--teal-soft);
  color:var(--teal-dark);padding:1px 6px;border-radius:4px;margin-right:6px}
.toggles{display:flex;gap:20px;flex-wrap:wrap;padding:14px 0 4px}
.toggles label{display:flex;align-items:center;gap:9px;font-weight:600;font-size:.88rem;cursor:pointer;margin:0}
.toggles input{width:19px;height:19px;accent-color:var(--teal);cursor:pointer}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;padding-top:18px;margin-top:14px;border-top:1px solid var(--line)}

/* ---------- image upload ---------- */
.upload{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px;border:1px dashed var(--line);border-radius:12px;background:#fafcfc}
.upload-preview{width:96px;height:70px;border-radius:9px;object-fit:cover;border:1px solid var(--line);background:var(--teal-soft)}
.upload-none{width:96px;height:70px;border-radius:9px;border:1px solid var(--line);background:var(--teal-soft);
  display:flex;align-items:center;justify-content:center;color:var(--teal);font-size:.72rem;text-align:center;padding:6px}
.upload-info{flex:1;min-width:150px;font-size:.82rem;color:var(--muted)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,140%);z-index:200;
  background:var(--ink);color:#fff;padding:13px 20px;border-radius:11px;font-size:.9rem;font-weight:500;
  box-shadow:0 12px 32px rgba(0,0,0,.22);max-width:90vw;transition:transform .3s cubic-bezier(.2,.9,.3,1)}
#toast.show{transform:translate(-50%,0)}
#toast.bad{background:var(--danger)}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}

/* ---------- role badge ---------- */
.role-badge{background:rgba(255,255,255,.2);color:#fff;font-size:.72rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px}

/* ---------- access list ---------- */
.person{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.person:last-child{border-bottom:none}
.person-avatar{width:42px;height:42px;flex:none;border-radius:50%;background:var(--teal-soft);
  color:var(--teal-dark);display:flex;align-items:center;justify-content:center;font-weight:700}
.person-main{flex:1;min-width:160px}
.person-main strong{display:block;font-size:.95rem;color:var(--ink)}
.person-main span{font-size:.82rem;color:var(--muted)}
select{padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:.88rem;background:#fff;color:var(--text)}
select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,115,119,.13)}
.role-help{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:18px}
.role-help div{background:#fafcfc;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.role-help strong{display:block;font-size:.86rem;color:var(--teal-dark)}
.role-help span{font-size:.8rem;color:var(--muted)}

/* ---------- import bar ---------- */
.import-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:#fdf8f1;border:1px solid #f3ddc0;border-radius:12px;padding:14px 18px;margin-bottom:16px}
.import-bar p{font-size:.88rem;color:#8a5a12;margin:0}

/* ---------- login ---------- */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(150deg,var(--teal) 0%,var(--teal-dark) 60%,#083f42 100%)}
.login-box{width:100%;max-width:400px;background:#fff;border-radius:18px;padding:34px 30px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.login-box img{height:52px;width:52px;border-radius:12px;object-fit:cover;margin-bottom:16px}
.login-box h1{font-family:'Playfair Display',Georgia,serif;font-size:1.5rem;color:var(--ink);margin-bottom:4px}
.login-box .sub{color:var(--muted);font-size:.88rem;margin-bottom:22px}
.credit{margin-top:30px;text-align:center;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.credit strong{color:var(--teal-dark);font-weight:700;letter-spacing:.11em}
.login-box .credit{margin-top:22px}
.note{background:#fdf1e3;color:#8a4b00;font-size:.84rem;padding:11px 13px;border-radius:9px;margin-bottom:16px}
</style>
</head>
<body>

<!-- ========== LOGIN ========== -->
<div class="login-page" id="loginPage">
  <div class="login-box">
    <img src="assets/images/logo-clean.jpg" alt="" />
    <h1>Site Manager</h1>
    <p class="sub">Sign in to manage The Community Pulse Foundation website.</p>
    <div id="loginNote" class="note hidden"></div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
    </div>
    <button class="btn btn-teal" style="width:100%" id="signInBtn">Sign in</button>
    <p class="credit">Designed &amp; powered by <strong>WianTribe&nbsp;Inc.</strong></p>
  </div>
</div>

<!-- ========== APP ========== -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img src="assets/images/logo-clean.jpg" alt="" />
        <div>Community Pulse<small>Site Manager</small></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <span id="roleBadge" class="role-badge hidden"></span>
        <button id="viewSiteBtn">View site</button>
        <button id="signOutBtn">Sign out</button>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <div class="tabs-inner" id="tabs"></div>
  </nav>

  <main class="wrap">
    <div class="head">
      <div>
        <h2 id="secTitle"></h2>
        <p id="secBlurb"></p>
      </div>
      <button class="btn btn-teal" id="addBtn">+ Add new</button>
    </div>

    <!-- editor -->
    <div class="card hidden" id="editor">
      <div class="card-pad">
        <h3 id="editorTitle" style="font-size:1.1rem;color:var(--ink);margin-bottom:16px"></h3>
        <div id="formFields"></div>
        <div class="form-actions">
          <button class="btn btn-teal" id="saveBtn">Save</button>
          <button class="btn btn-grey" id="cancelBtn">Cancel</button>
        </div>
      </div>
    </div>

    <!-- list -->
    <div class="card" id="listCard"><div class="empty">Loading…</div></div>

    <p class="credit">Designed &amp; powered by <strong>WianTribe&nbsp;Inc.</strong></p>
  </main>
</div>

<div id="toast"></div>

<script src="assets/js/data.js"></script>

<script>
/* =====================================================
   SECTION DEFINITIONS — everything is driven by this
   ===================================================== */
const SECTIONS = {
  pages: {
    label: 'Pages', table: 'pages', title: 'Custom pages',
    blurb: 'Pages you create here get their own web address and can appear in the site menu.',
    display: r => r.title_en, order: 'menu_order', flag: 'published',
    flagLabels: ['Live', 'Draft'],
    sub: r => `/page.html?slug=${r.slug}${r.show_in_menu ? '' : ' · hidden from menu'}`,
    fields: [
      { k:'title_en', t:'text', l:'Page title', lang:'EN', req:true },
      { k:'title_fr', t:'text', l:'Page title', lang:'FR' },
      { k:'slug', t:'text', l:'Web address', hint:'lowercase, dashes instead of spaces', auto:'title_en' },
      { k:'image_url', t:'image', l:'Banner photo' },
      { k:'body_en', t:'textarea', l:'Content', lang:'EN' },
      { k:'body_fr', t:'textarea', l:'Content', lang:'FR' },
      { k:'menu_order', t:'number', l:'Menu position', hint:'lower numbers come first', def:1 },
      { k:'show_in_menu', t:'check', l:'Show in the website menu', def:true },
      { k:'published', t:'check', l:'Published (visitors can see it)', def:false }
    ]
  },

  programs: {
    label: 'Programs', table: 'programs', title: 'Programs',
    blurb: 'The programme cards shown in the "Our Core Programs" section of the home page.',
    display: r => r.title_en, order: 'sort_order', flag: 'visible',
    flagLabels: ['Shown', 'Hidden'],
    sub: r => r.subtitle_en || '',
    fields: [
      { k:'title_en', t:'text', l:'Programme name', lang:'EN', req:true },
      { k:'title_fr', t:'text', l:'Programme name', lang:'FR' },
      { k:'subtitle_en', t:'text', l:'Short tagline', lang:'EN' },
      { k:'subtitle_fr', t:'text', l:'Short tagline', lang:'FR' },
      { k:'image_url', t:'image', l:'Programme photo' },
      { k:'description_en', t:'textarea', l:'Description', lang:'EN' },
      { k:'description_fr', t:'textarea', l:'Description', lang:'FR' },
      { k:'sort_order', t:'number', l:'Display order', def:1 },
      { k:'visible', t:'check', l:'Show on the website', def:true }
    ]
  },

  events: {
    label: 'Events', table: 'events', title: 'Events & outreaches',
    blurb: 'Past and upcoming work shown in the "Our Impact" section.',
    display: r => r.title_en, order: 'sort_order', flag: 'visible',
    flagLabels: ['Shown', 'Hidden'],
    sub: r => [r.date_en, r.location_en].filter(Boolean).join(' · '),
    fields: [
      { k:'title_en', t:'text', l:'Event title', lang:'EN', req:true },
      { k:'title_fr', t:'text', l:'Event title', lang:'FR' },
      { k:'date_en', t:'text', l:'Date', lang:'EN', hint:'e.g. June 2025' },
      { k:'date_fr', t:'text', l:'Date', lang:'FR', hint:'e.g. Juin 2025' },
      { k:'location_en', t:'text', l:'Location', lang:'EN' },
      { k:'location_fr', t:'text', l:'Location', lang:'FR' },
      { k:'image_url', t:'image', l:'Event photo' },
      { k:'summary_en', t:'textarea', l:'Short summary', lang:'EN' },
      { k:'summary_fr', t:'textarea', l:'Short summary', lang:'FR' },
      { k:'details_en', t:'textarea', l:'Full details', lang:'EN' },
      { k:'details_fr', t:'textarea', l:'Full details', lang:'FR' },
      { k:'sort_order', t:'number', l:'Display order', def:1 },
      { k:'visible', t:'check', l:'Show on the website', def:true }
    ]
  },

  team: {
    label: 'Team', table: 'team', title: 'Team members',
    blurb: 'People shown in the "Meet the Team" section. Add a photo or leave it blank for an initial.',
    display: r => r.name, order: 'sort_order', flag: 'visible',
    flagLabels: ['Shown', 'Hidden'],
    sub: r => r.role_en || '',
    fields: [
      { k:'name', t:'text', l:'Full name', req:true },
      { k:'image_url', t:'image', l:'Photo' },
      { k:'role_en', t:'text', l:'Role or title', lang:'EN' },
      { k:'role_fr', t:'text', l:'Role or title', lang:'FR' },
      { k:'bio_en', t:'textarea', l:'Short bio', lang:'EN' },
      { k:'bio_fr', t:'textarea', l:'Short bio', lang:'FR' },
      { k:'sort_order', t:'number', l:'Display order', def:1 },
      { k:'visible', t:'check', l:'Show on the website', def:true }
    ]
  },

  settings: { label:'Site text & photos', settings:true, title:'Site text, contact details & photos',
    blurb:'Headline, contact information, and the main photos used across the site.' },

  access: { label:'Team access', access:true, title:'Who can manage this site',
    blurb:'Owner has full control. Admin can manage content and people. Editor can change content. Viewer can look but not change.' }
};

const ROLES = {
  owner:  { label:'Owner',  desc:'Full control, including removing people' },
  admin:  { label:'Admin',  desc:'Manage all content and team access' },
  editor: { label:'Editor', desc:'Add and edit content, no access changes' },
  viewer: { label:'Viewer', desc:'Can sign in and look, cannot change anything' }
};

const IMAGE_SETTINGS = {
  imgHero:       'Home page background photo',
  imgLogo:       'Logo (header and footer)',
  imgAbout:      'About section photo',
  imgActionPlan: 'Programme action plan image',
  imgImpact:     'Impact section photo',
  imgVolunteer:  'Get Involved photo'
};

const SETTING_LABELS = {
  heroTitle1:   'Headline — first line',
  heroTitle2:   'Headline — second line',
  heroSubtitle: 'Headline paragraph',
  contactEmail: 'Contact email',
  contactPhone: 'Contact phone',
  contactPlace: 'Location',
  donateEmail:  'Interac e-Transfer email',
  volunteerForm:'Volunteer form link',
  socialFacebook: 'Facebook page link',
  socialInstagram:'Instagram link',
  socialYouTube:  'YouTube channel link',
  socialLinkedIn: 'LinkedIn link',
  socialTikTok:   'TikTok link',
  socialX:        'X (Twitter) link',
  socialWhatsApp: 'WhatsApp link'
};

/* =====================================================
   STATE + HELPERS
   ===================================================== */
let current = 'pages';
let rows = [];
let editingId = null;
let draftImage = null;
let myRole = 'viewer';
let myId = null;

const canEdit = () => ['owner','admin','editor'].includes(myRole);
const canManageUsers = () => ['owner','admin'].includes(myRole);
const isOwner = () => myRole === 'owner';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function toast(msg, bad) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = ''; }, 3600);
}

function slugify(s) {
  return String(s||'').toLowerCase().trim()
    .replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-');
}

/* =====================================================
   AUTH
   ===================================================== */
async function signIn() {
  if (!window.cpfDb) return loginNote('Database connection error. Please try again.');
  const { error } = await cpfDb.auth.signInWithPassword({
    email: $('email').value.trim(), password: $('password').value
  });
  if (error) return loginNote(error.message);
  start();
}

function loginNote(msg) {
  const n = $('loginNote');
  n.textContent = msg;
  n.classList.remove('hidden');
}

async function start() {
  $('loginPage').classList.add('hidden');
  $('app').classList.remove('hidden');

  const { data: sess } = await cpfDb.auth.getSession();
  myId = sess.session ? sess.session.user.id : null;

  if (myId) {
    const { data: me } = await cpfDb.from('profiles').select('role').eq('id', myId).maybeSingle();
    myRole = me ? me.role : 'viewer';
  }

  const badge = $('roleBadge');
  if (badge) {
    badge.textContent = (ROLES[myRole] || {}).label || myRole;
    badge.classList.remove('hidden');
  }

  buildTabs();
  openSection('pages');
}

/* =====================================================
   TABS
   ===================================================== */
function buildTabs() {
  $('tabs').innerHTML = Object.entries(SECTIONS)
    .filter(([k, s]) => !(s.access && !canManageUsers()))
    .map(([k, s]) => `<button class="tab" data-tab="${k}">${s.label}</button>`).join('');
}

function openSection(key) {
  current = key;
  editingId = null;
  draftImage = null;
  const s = SECTIONS[key];

  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.dataset.tab === key));

  $('secTitle').textContent = s.title;
  $('secBlurb').textContent = s.blurb;
  $('editor').classList.add('hidden');
  $('addBtn').classList.toggle('hidden', !!s.settings || !!s.access || !canEdit());

  if (s.access)        loadAccess();
  else if (s.settings) loadSettings();
  else                 loadRows();
}

/* =====================================================
   LIST
   ===================================================== */
async function loadRows() {
  const s = SECTIONS[current];
  const { data, error } = await cpfDb.from(s.table).select('*').order(s.order, { ascending:true });
  if (error) { $('listCard').innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  rows = data || [];
  renderList();
}

function renderList() {
  const s = SECTIONS[current];

  const importable = IMPORTABLE[current] && canEdit();
  const importBar = importable ? `
    <div class="import-bar">
      <p>The ${s.label.toLowerCase()} currently on your website are built in and not editable.
         Copy them here once and you can edit them from now on.</p>
      <button class="btn-sm btn-out" id="importBtn">Import from website</button>
    </div>` : '';

  if (!rows.length) {
    $('listCard').innerHTML =
      importBar +
      `<div class="empty"><strong>Nothing here yet</strong>Use “Add new” to create your first entry, or import what is already on the site.</div>`;
    const ib = $('importBtn'); if (ib) ib.addEventListener('click', importBuiltIn);
    return;
  }
  $('listCard').innerHTML = rows.map(r => {
    const on = r[s.flag];
    const name = esc(s.display(r) || 'Untitled');
    const thumb = r.image_url
      ? `<img class="thumb" src="${esc(r.image_url)}" alt="" />`
      : `<div class="thumb">${esc((s.display(r)||'?').charAt(0).toUpperCase())}</div>`;
    return `
      <div class="item">
        ${thumb}
        <div class="item-main">
          <strong>${name}</strong>
          <span><span class="chip ${on?'chip-live':'chip-draft'}">${on?s.flagLabels[0]:s.flagLabels[1]}</span>${esc(s.sub(r))}</span>
        </div>
        <div class="item-actions">
          ${canEdit() ? `<button class="btn-sm btn-out" data-edit="${r.id}">Edit</button>
          <button class="btn-sm btn-red" data-del="${r.id}">Delete</button>` : ''}
        </div>
      </div>`;
  }).join('');
}

/* =====================================================
   EDITOR
   ===================================================== */
function openEditor(id) {
  const s = SECTIONS[current];
  const row = id ? rows.find(r => r.id === id) : null;
  editingId = id || null;
  draftImage = row ? row.image_url : null;

  $('editorTitle').textContent = row ? `Edit “${s.display(row)}”` : `Add to ${s.label.toLowerCase()}`;
  $('formFields').innerHTML = s.fields.map(f => fieldHtml(f, row)).join('');
  $('editor').classList.remove('hidden');
  $('editor').scrollIntoView({ behavior:'smooth', block:'start' });
}

function fieldHtml(f, row) {
  const v = row ? row[f.k] : (f.def !== undefined ? f.def : '');
  const tag = f.lang ? `<span class="lang-tag">${f.lang}</span>` : '';
  const hint = f.hint ? ` <span class="hint">— ${f.hint}</span>` : '';
  const label = `<label for="f_${f.k}">${tag}${f.l}${hint}</label>`;

  if (f.t === 'check') {
    return `<div class="toggles"><label><input type="checkbox" id="f_${f.k}" ${v ? 'checked':''} /> ${f.l}</label></div>`;
  }
  if (f.t === 'textarea') {
    return `<div class="field">${label}<textarea id="f_${f.k}" placeholder="Leave a blank line between paragraphs. Start a line with ## for a heading, or - for a bullet.">${esc(v)}</textarea></div>`;
  }
  if (f.t === 'number') {
    return `<div class="field">${label}<input type="number" id="f_${f.k}" value="${esc(v||0)}" /></div>`;
  }
  if (f.t === 'image') {
    const prev = v
      ? `<img class="upload-preview" id="imgPrev" src="${esc(v)}" alt="" />`
      : `<div class="upload-none" id="imgPrev">No photo</div>`;
    return `<div class="field">${label}
      <div class="upload">
        ${prev}
        <div class="upload-info" id="imgInfo">JPG or PNG, up to 5 MB. Landscape photos look best.</div>
        <input type="file" id="imgFile" accept="image/*" style="display:none" />
        <button type="button" class="btn-sm btn-out" id="imgPick">Choose photo</button>
        <button type="button" class="btn-sm btn-grey" id="imgClear">Remove</button>
      </div></div>`;
  }
  return `<div class="field">${label}<input type="text" id="f_${f.k}" value="${esc(v)}" /></div>`;
}

/* ---------- image upload ---------- */
async function uploadImage(file) {
  if (file.size > 5 * 1024 * 1024) return toast('That photo is larger than 5 MB. Please choose a smaller one.', true);
  $('imgInfo').textContent = 'Uploading…';

  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${current}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;

  const { error } = await cpfDb.storage.from('site-images').upload(path, file, { upsert:false });
  if (error) { $('imgInfo').textContent = error.message; return toast('Upload failed: ' + error.message, true); }

  const { data } = cpfDb.storage.from('site-images').getPublicUrl(path);
  draftImage = data.publicUrl;

  const prev = $('imgPrev');
  const img = document.createElement('img');
  img.className = 'upload-preview'; img.id = 'imgPrev'; img.src = draftImage;
  prev.replaceWith(img);
  $('imgInfo').textContent = 'Photo ready. Click Save to apply it.';
}

/* ---------- save ---------- */
async function save() {
  const s = SECTIONS[current];
  const body = {};

  for (const f of s.fields) {
    if (f.t === 'image') { body[f.k] = draftImage || null; continue; }
    const el = $('f_' + f.k);
    if (!el) continue;
    if (f.t === 'check') body[f.k] = el.checked;
    else if (f.t === 'number') body[f.k] = parseInt(el.value, 10) || 0;
    else body[f.k] = el.value.trim() || null;
  }

  const required = s.fields.find(f => f.req && !body[f.k]);
  if (required) return toast(`${required.l} is required.`, true);

  if (current === 'pages') body.slug = slugify(body.slug || body.title_en);

  const { error } = editingId
    ? await cpfDb.from(s.table).update(body).eq('id', editingId)
    : await cpfDb.from(s.table).insert(body);

  if (error) {
    return toast(error.message.includes('duplicate')
      ? 'Another page already uses that web address.' : error.message, true);
  }

  toast(editingId ? 'Changes saved.' : 'Added.');
  $('editor').classList.add('hidden');
  editingId = null; draftImage = null;
  loadRows();
}

async function remove(id) {
  const s = SECTIONS[current];
  const row = rows.find(r => r.id === id);
  if (!confirm(`Delete “${s.display(row)}”? This cannot be undone.`)) return;
  const { error } = await cpfDb.from(s.table).delete().eq('id', id);
  if (error) return toast(error.message, true);
  toast('Deleted.');
  loadRows();
}

/* =====================================================
   TEAM ACCESS TAB
   ===================================================== */
async function loadAccess() {
  const { data, error } = await cpfDb.from('profiles').select('*').order('created_at');
  if (error) { $('listCard').innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }

  const help = `<div class="role-help">` + Object.entries(ROLES)
    .map(([k, r]) => `<div><strong>${r.label}</strong><span>${r.desc}</span></div>`).join('') + `</div>`;

  const people = (data || []).map(p => {
    const name = p.full_name || p.email || 'Unknown';
    const me = p.id === myId;
    // you cannot change your own role, and only the owner can touch an owner
    const locked = me || (p.role === 'owner' && !isOwner());
    const options = Object.entries(ROLES).map(([k, r]) =>
      `<option value="${k}" ${p.role === k ? 'selected' : ''}>${r.label}</option>`).join('');

    return `<div class="person">
      <div class="person-avatar">${esc(name.charAt(0).toUpperCase())}</div>
      <div class="person-main">
        <strong>${esc(name)}${me ? ' (you)' : ''}</strong>
        <span>${esc(p.email || '')}</span>
      </div>
      ${locked
        ? `<span class="chip chip-live">${(ROLES[p.role]||{}).label || p.role}</span>`
        : `<select data-role-for="${p.id}">${options}</select>`}
      ${(isOwner() && !me && p.role !== 'owner')
        ? `<button class="btn-sm btn-red" data-remove="${p.id}">Remove</button>` : ''}
    </div>`;
  }).join('');

  $('listCard').innerHTML = people + help +
    `<div class="card-pad" style="border-top:1px solid var(--line);color:var(--muted);font-size:.86rem">
       To add someone new: in Supabase go to <strong>Authentication &rarr; Users &rarr; Add user</strong>,
       tick <em>Auto Confirm User</em>, then come back here and give them a role.
       New people start as <strong>Viewer</strong> until you change it.
     </div>`;

  $('listCard').querySelectorAll('[data-role-for]').forEach(sel => {
    sel.addEventListener('change', async () => {
      const { error } = await cpfDb.from('profiles')
        .update({ role: sel.value }).eq('id', sel.dataset.roleFor);
      toast(error ? error.message : 'Role updated.', !!error);
      if (error) loadAccess();
    });
  });

  $('listCard').querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Remove this person\'s access? They will no longer be able to sign in and manage the site.')) return;
      const { error } = await cpfDb.from('profiles').delete().eq('id', btn.dataset.remove);
      toast(error ? error.message : 'Access removed.', !!error);
      loadAccess();
    });
  });
}

/* =====================================================
   IMPORT THE SITE'S BUILT-IN CONTENT
   ===================================================== */
const IMPORTABLE = {
  programs: () => (siteData.programs || []).map((p, i) => ({
    title_en: p.title.en, title_fr: p.title.fr,
    subtitle_en: p.subtitle ? p.subtitle.en : null,
    subtitle_fr: p.subtitle ? p.subtitle.fr : null,
    description_en: p.description ? p.description.en : null,
    description_fr: p.description ? p.description.fr : null,
    image_url: p.image || null, sort_order: i + 1, visible: true
  })),
  events: () => (siteData.events || []).map((e, i) => ({
    title_en: e.title.en, title_fr: e.title.fr,
    date_en: e.date ? e.date.en : null, date_fr: e.date ? e.date.fr : null,
    location_en: e.location ? e.location.en : null,
    location_fr: e.location ? e.location.fr : null,
    summary_en: e.summary ? e.summary.en : null,
    summary_fr: e.summary ? e.summary.fr : null,
    details_en: e.details ? e.details.en : null,
    details_fr: e.details ? e.details.fr : null,
    image_url: e.image || null, sort_order: i + 1, visible: true
  })),
  team: () => (siteData.team || []).map((m, i) => ({
    name: m.name,
    role_en: m.role ? m.role.en : null, role_fr: m.role ? m.role.fr : null,
    bio_en: m.bio ? m.bio.en : null, bio_fr: m.bio ? m.bio.fr : null,
    image_url: m.image || null, sort_order: i + 1, visible: true
  }))
};

async function importBuiltIn() {
  if (typeof siteData === 'undefined' || !IMPORTABLE[current]) return;
  const items = IMPORTABLE[current]();
  if (!items.length) return toast('Nothing to import.', true);
  if (!confirm(`Copy the ${items.length} ${current} currently on the website into the database so you can edit them?`)) return;

  const { error } = await cpfDb.from(SECTIONS[current].table).insert(items);
  if (error) return toast(error.message, true);
  toast(`${items.length} imported. You can edit them now.`);
  loadRows();
}

/* =====================================================
   SETTINGS TAB
   ===================================================== */
async function loadSettings() {
  const { data, error } = await cpfDb.from('settings').select('*');
  if (error) { $('listCard').innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }

  const textRows  = (data||[]).filter(r => !IMAGE_SETTINGS[r.key]);
  const imageRows = (data||[]).filter(r =>  IMAGE_SETTINGS[r.key]);

  const order = Object.keys(SETTING_LABELS);
  textRows.sort((a,b) => order.indexOf(a.key) - order.indexOf(b.key));

  const textHtml = textRows.map(r => {
    const label = SETTING_LABELS[r.key] || r.key;

    // links are identical in both languages, so show a single box
    if (r.key.startsWith('social') || r.key === 'volunteerForm') {
      return `<div class="field">
        <label>${esc(label)} <span class="hint">— leave empty to hide the button</span></label>
        <input type="text" id="set_en_${r.key}" value="${esc(r.value_en)}" placeholder="https://..." />
        <input type="hidden" id="set_fr_${r.key}" value="${esc(r.value_en)}" />
      </div>`;
    }
    const long = (r.value_en || '').length > 70;
    const input = (id, val) => long
      ? `<textarea id="${id}" style="min-height:90px">${esc(val)}</textarea>`
      : `<input type="text" id="${id}" value="${esc(val)}" />`;
    return `<div class="field">
      <label>${esc(label)}</label>
      <div class="pair">
        <div><span class="lang-tag">EN</span>${input('set_en_'+r.key, r.value_en)}</div>
        <div><span class="lang-tag">FR</span>${input('set_fr_'+r.key, r.value_fr)}</div>
      </div></div>`;
  }).join('');

  const imageHtml = imageRows.map(r => `
    <div class="field">
      <label>${esc(IMAGE_SETTINGS[r.key])}</label>
      <div class="upload">
        <img class="upload-preview" id="prev_${r.key}" src="${esc(r.value_en)}" alt="" />
        <div class="upload-info" id="info_${r.key}">JPG or PNG, up to 5 MB.</div>
        <input type="file" id="file_${r.key}" accept="image/*" style="display:none" />
        <button type="button" class="btn-sm btn-out" data-pick="${r.key}">Change photo</button>
      </div>
    </div>`).join('');

  $('listCard').innerHTML = `<div class="card-pad">
      ${textHtml}
      <h3 style="font-size:1.05rem;color:var(--ink);margin:26px 0 14px;padding-top:20px;border-top:1px solid var(--line)">Site photos</h3>
      ${imageHtml}
      <div class="form-actions">
        <button class="btn btn-teal" id="saveSettings" ${canEdit() ? '' : 'disabled'}>Save changes</button>
      </div>
      ${canEdit() ? '' : '<p style="color:var(--muted);font-size:.86rem;margin-top:10px">Your role can view these but not change them.</p>'}
    </div>`;

  // photo pickers
  $('listCard').querySelectorAll('[data-pick]').forEach(btn => {
    const key = btn.dataset.pick;
    btn.addEventListener('click', () => $('file_' + key).click());
    $('file_' + key).addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) return toast('That photo is larger than 5 MB.', true);
      $('info_' + key).textContent = 'Uploading...';

      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `site/${key}-${Date.now()}.${ext}`;
      const { error: upErr } = await cpfDb.storage.from('site-images').upload(path, file);
      if (upErr) { $('info_' + key).textContent = upErr.message; return toast(upErr.message, true); }

      const { data: pub } = cpfDb.storage.from('site-images').getPublicUrl(path);
      const { error: dbErr } = await cpfDb.from('settings')
        .update({ value_en: pub.publicUrl, value_fr: pub.publicUrl }).eq('key', key);

      if (dbErr) return toast(dbErr.message, true);
      $('prev_' + key).src = pub.publicUrl;
      $('info_' + key).textContent = 'Updated. It is live on the site now.';
      toast('Photo updated.');
    });
  });

  const saveBtn = $('saveSettings');
  if (saveBtn) saveBtn.addEventListener('click', async () => {
    const updates = textRows.map(r => {
      const en = $('set_en_' + r.key).value;
      const isLink = r.key.startsWith('social') || r.key === 'volunteerForm';
      return { key: r.key, value_en: en, value_fr: isLink ? en : $('set_fr_' + r.key).value };
    });
    const { error } = await cpfDb.from('settings').upsert(updates);
    toast(error ? error.message : 'Saved.', !!error);
  });
}

/* =====================================================
   EVENTS
   ===================================================== */
$('signInBtn').addEventListener('click', signIn);
$('password').addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });
$('signOutBtn').addEventListener('click', async () => { await cpfDb.auth.signOut(); location.reload(); });
$('viewSiteBtn').addEventListener('click', () => window.open('index.html', '_blank'));
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) openSection(b.dataset.tab); });
$('addBtn').addEventListener('click', () => openEditor(null));
$('cancelBtn').addEventListener('click', () => { $('editor').classList.add('hidden'); editingId = null; draftImage = null; });
$('saveBtn').addEventListener('click', save);

$('listCard').addEventListener('click', e => {
  const ed = e.target.closest('[data-edit]');
  const dl = e.target.closest('[data-del]');
  if (ed) openEditor(ed.dataset.edit);
  if (dl) remove(dl.dataset.del);
});

$('formFields').addEventListener('click', e => {
  if (e.target.id === 'imgPick') $('imgFile').click();
  if (e.target.id === 'imgClear') {
    draftImage = null;
    const d = document.createElement('div');
    d.className = 'upload-none'; d.id = 'imgPrev'; d.textContent = 'No photo';
    $('imgPrev').replaceWith(d);
    $('imgInfo').textContent = 'Photo removed. Click Save to apply.';
  }
});

$('formFields').addEventListener('change', e => {
  if (e.target.id === 'imgFile' && e.target.files[0]) uploadImage(e.target.files[0]);
});

$('formFields').addEventListener('blur', e => {
  if (e.target.id === 'f_title_en' && current === 'pages') {
    const slug = $('f_slug');
    if (slug && !slug.value.trim()) slug.value = slugify(e.target.value);
  }
}, true);

/* ---------- boot ---------- */
(async () => {
  if (!window.cpfDb) return loginNote('Database connection error. Please try again.');
  const { data } = await cpfDb.auth.getSession();
  if (data.session) start();
})();
