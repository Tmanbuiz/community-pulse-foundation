<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Volunteer CRM | The Community Pulse Foundation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="/assets/images/logo-clean.jpg" />
  <!-- Versioned deliberately. The zone's Browser Cache TTL overrides the
       Cache-Control we set in _headers, so the only dependable way to stop
       admins running a stale copy of the app against a newer API is to change
       the URL. Bump ?v= on every change to admin-crm.js or admin-crm.css. -->
  <link rel="stylesheet" href="/assets/css/admin-crm.css?v=20260817f" />
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>

  <header class="crm-header">
    <div class="crm-header-inner">
      <a href="#/" class="crm-brand">
        <img src="/assets/images/logo-clean.jpg" alt="" width="32" height="32" />
        <span>Volunteer CRM</span>
      </a>
      <nav class="crm-nav" aria-label="Sections">
        <a href="#/" data-nav="dashboard">Dashboard</a>
        <a href="#/volunteers" data-nav="volunteers">Volunteers</a>
        <a href="#/enquiries" data-nav="enquiries">Enquiries</a>
        <a href="#/events" data-nav="events">Events</a>
      </nav>
      <div class="crm-actor" id="crmActor" aria-live="polite"></div>
    </div>
  </header>

  <main id="main" class="crm-main">
    <div class="crm-loading" id="crmLoading">Loading…</div>
    <div class="crm-error" id="crmError" role="alert" hidden></div>
    <div id="crmView"></div>
  </main>

  <script src="/assets/js/admin-crm.js?v=20260817f"></script>
</body>
</html>
