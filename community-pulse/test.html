<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connection Test</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:700px;margin:40px auto;padding:0 20px;line-height:1.6;color:#222}
  h1{font-size:1.3rem}
  .row{padding:12px 14px;border-radius:8px;margin-bottom:10px;font-size:.95rem}
  .ok{background:#e6f4ea;color:#1a7f43}
  .bad{background:#fdecea;color:#c0392b}
  .info{background:#f1f5f9;color:#334155}
  pre{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:8px;overflow-x:auto;font-size:.82rem}
</style>
</head>
<body>
<h1>Community Pulse — Connection Test</h1>
<p>This page checks each step and shows the exact error. Send a screenshot of everything below.</p>
<div id="out"></div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://gbplyifhbniqbapcdlph.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdicGx5aWZoYm5pcWJhcGNkbHBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMjk0MzYsImV4cCI6MjEwMTYwNTQzNn0.xON8mQC7XD7LqHtzvjnQ89ArOAXAuwcNUuxP-qVERYo";

const out = document.getElementById('out');
const say = (cls, msg) => {
  const d = document.createElement('div');
  d.className = 'row ' + cls;
  d.textContent = msg;
  out.appendChild(d);
};
const dump = (obj) => {
  const p = document.createElement('pre');
  p.textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
  out.appendChild(p);
};

(async () => {
  // 1. Library
  if (window.supabase && window.supabase.createClient) {
    say('ok', '1. Supabase library loaded OK');
  } else {
    say('bad', '1. Supabase library did NOT load — the CDN script is blocked or the URL is wrong. Nothing else can work until this is fixed.');
    return;
  }

  // 2. Client
  let db;
  try {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    say('ok', '2. Client created OK');
  } catch (e) {
    say('bad', '2. Could not create client');
    dump(String(e));
    return;
  }

  // 3. Read a table (tests the key + RLS + CORS)
  try {
    const { data, error } = await db.from('pages').select('slug, title_en').limit(5);
    if (error) {
      say('bad', '3. Could not read the pages table');
      dump(error);
    } else {
      say('ok', `3. Read the pages table OK — ${data.length} published page(s) found`);
      dump(data);
    }
  } catch (e) {
    say('bad', '3. Network error reaching Supabase (often CORS or a wrong project URL)');
    dump(String(e));
  }

  // 4. Check the other tables exist
  for (const t of ['programs', 'events', 'team', 'settings']) {
    const { error } = await db.from(t).select('*').limit(1);
    if (error) say('bad', `4. Table "${t}" — ${error.message}`);
    else say('ok', `4. Table "${t}" exists and is readable`);
  }

  // 5. Auth session
  const { data: s } = await db.auth.getSession();
  say('info', s.session ? '5. You are signed in as ' + s.session.user.email
                        : '5. Not signed in (normal if you have not logged in on this page)');

  say('info', 'Page URL: ' + location.origin);
})();
</script>
</body>
</html>
